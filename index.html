<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Live Market Terminal</title>
    <style>
        body { background-color: #11141a; color: #e9ecf0; font-family: system-ui, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: #1e222d; padding: 24px; border-radius: 12px; border: 1px solid #2a2e39; }
        h1 { font-size: 1.5rem; margin-top: 0; color: #ffffff; border-bottom: 1px solid #2a2e39; padding-bottom: 10px; }
        .metric { margin-bottom: 15px; }
        .label { color: #848e9c; font-size: 0.9rem; margin-bottom: 4px; }
        .value { font-size: 1.2rem; font-weight: bold; color: #f0b90b; }
        #price { font-size: 2.5rem; color: #0ecb81; font-weight: bold; font-variant-numeric: tabular-nums; margin: 10px 0; }
        select { background: #2a2e39; color: white; border: 1px solid #474d57; padding: 8px 12px; border-radius: 6px; width: 100%; font-size: 1rem; margin-top: 5px; cursor: pointer; }
        .terminal { background: #0b0e11; border: 1px solid #2a2e39; border-radius: 6px; padding: 12px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; color: #b7bdc6; margin-top: 20px; }
        .text-green-400 { color: #0ecb81; }
        .text-red-500 { color: #f6465d; }
        .text-gray-400 { color: #848e9c; }
    </style>
</head>
<body>

    <div class="container">
        <h1>LIVE Market Terminal</h1> 
        <div style="margin-bottom: 20px; padding: 15px; background: #1e222d; border-radius: 8px; border: 1px solid #2a2e39;">
            <div class="label" style="margin-bottom: 8px;">Deriv API Token</div>
            <input type="password" id="api-token" placeholder="Paste your token here..." style="width: 100%; padding: 10px; background: #0b0e11; color: white; border: 1px solid #2a2e39; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px;">
            <button id="connect-btn" style="width: 100%; padding: 10px; background: #0ecb81; color: #11141a; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Connect Terminal</button>
        </div>
        
        <div class="metric">
            <div class="label">Status</div>
            <div id="statusText" class="value" style="color: #0ecb81;">Initializing...</div>
        </div>

        <div class="metric">
            <div class="label">select-market Index</div>
            <select id="market-select">
                <option value="1HZ100V">Volatility 100 (1s) Index</option>
                <option value="R_75">Volatility 75 Index</option>
                <option value="R_50">Volatility 50 Index</option>
                <option value="R_25">Volatility 25 Index</option>
                <option value="R_10">Volatility 10 Index</option>
            </select>
        </div>

        <div class="metric">
            <div class="label">Latest Feed Tick</div>
            <div id="price-display">$0.0000</div>
        </div>

        <div class="label">Live Connection Activity Logs</div>
        <div id="log-terminal" class="terminal">
            <div>[System] Interface initialized. Waiting for script linkage...</div>
        </div>
    </div>

    <!-- Links directly to your script file -->
    <script src="deriv.js"></script>
</body>
</html>
